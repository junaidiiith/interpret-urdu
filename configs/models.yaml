# Model registry for Stages B/D/E (interlingua anchoring, log-prob, cross-model replication).
# Repo IDs and revisions verified against the HF Hub on 2026-07-12; pin by commit sha so a
# run_manifest.json can record exactly which snapshot produced a given result (Section 11 of
# the proposal).
#
# NOTE on Section 5 role coverage: this registry is the user-specified set of small (~0.8-4B)
# checkpoints actually available/verified in this environment. It gives two base/instruct model
# families for the general-purpose role, a within-family size-scaling pair (Qwen3.5 0.8B vs 2B)
# as an additional robustness axis not in the original Section 5 language, and one architecturally
# distinct smaller model (SmolLM3) as the "older/smaller robustness check" role. No checkpoint here
# fulfills the "stronger reported multilingual balance" (Aya-class) or "Urdu-adapted / continued-
# pretrained specialist" roles from Section 5 — that's a real gap against the proposal text, not a
# silent substitution, and Section 5 should be revised to describe this registry before submission.

models:
  - key: gemma3n-e2b-instruct
    role: general_purpose_1
    hf_repo: google/gemma-3n-E2B-it
    revision: 5e092ebca197cdcd8d8b195040accf22693501bc
    gated: true          # accepted under the junaidiiith HF account
    variant: instruct
    family: gemma-3n

  - key: gemma3n-e4b-base
    role: general_purpose_1_base
    hf_repo: google/gemma-3n-E4B
    revision: af70430f84ea4d7ac191aaa2bd8e14d2a5e8f6ee
    gated: true
    variant: base
    family: gemma-3n

  - key: qwen3.5-0.8b-base
