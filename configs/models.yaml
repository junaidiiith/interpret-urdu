    revision: dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68
    gated: false
    variant: base
    family: qwen3.5

  - key: qwen3.5-0.8b-instruct
    role: general_purpose_2
    hf_repo: Qwen/Qwen3.5-0.8B
    revision: 2fc06364715b967f1860aea9cf38778875588b17
    gated: false
    variant: instruct
    family: qwen3.5

  - key: qwen3.5-2b-base
