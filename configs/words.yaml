  - word: گھوڑا
    translit: ghora
    gloss: horse
  - word: قلم
    translit: qalam
    gloss: pen
  - word: کاغذ
    translit: kaghaz
    gloss: paper
  - word: بستر
    translit: bistar
    gloss: bed
  - word: دودھ
