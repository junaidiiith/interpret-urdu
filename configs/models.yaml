# Model registry for interpret-urdu (CHR camera-ready paper roster + optional extras).
#
# Paper-reported roster (RQ1–RQ3 results): Qwen3.5 (0.8B/2B base+instruct) and
# SmolLM3-3B (base+instruct) — six open-weight checkpoints, two families, ≤3B.
# Gemma-3n keys remain available for optional extension / future work; causal
# patching and Patchscopes scripts exclude Gemma-3n's AltUp architecture.
#
# Repo IDs and revisions pinned so a run_manifest can record exactly which
# snapshot produced a given result.

models:
  # --- Paper roster: Qwen3.5 ---
  - key: qwen3.5-0.8b-base
    role: paper_qwen_base_small
    hf_repo: Qwen/Qwen3.5-0.8B-Base
    revision: dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68
    gated: false
    variant: base
    family: qwen3.5

  - key: qwen3.5-0.8b-instruct
    role: paper_qwen_instruct_small
    hf_repo: Qwen/Qwen3.5-0.8B
    revision: 2fc06364715b967f1860aea9cf38778875588b17
    gated: false
    variant: instruct
    family: qwen3.5

  - key: qwen3.5-2b-base
    role: paper_qwen_base_mid
    hf_repo: Qwen/Qwen3.5-2B-Base
    revision: b1485b2fa6dfa1287294f269f5fb618e03d52d7c
    gated: false
    variant: base
    family: qwen3.5

  - key: qwen3.5-2b-instruct
    role: paper_qwen_instruct_mid
    hf_repo: Qwen/Qwen3.5-2B
    revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
    gated: false
    variant: instruct
    family: qwen3.5

  # --- Paper roster: SmolLM3 ---
  - key: smollm3-3b-instruct
    role: paper_smollm_instruct
    hf_repo: HuggingFaceTB/SmolLM3-3B
    revision: a07cc9a04f16550a088caea529712d1d335b0ac1
    gated: false
    variant: instruct
    family: smollm3

  - key: smollm3-3b-base
    role: paper_smollm_base
    hf_repo: HuggingFaceTB/SmolLM3-3B-Base
    revision: d78a42f79198603e614095753484a04c10c2b940
    gated: false
    variant: base
    family: smollm3

  # --- Optional / future work (not in paper's reported family split) ---
  - key: gemma3n-e2b-instruct
    role: optional_gemma_instruct
    hf_repo: google/gemma-3n-E2B-it
    revision: 5e092ebca197cdcd8d8b195040accf22693501bc
    gated: true
    variant: instruct
    family: gemma-3n

  - key: gemma3n-e4b-base
    role: optional_gemma_base
    hf_repo: google/gemma-3n-E4B
    revision: af70430f84ea4d7ac191aaa2bd8e14d2a5e8f6ee
    gated: true
    variant: base
    family: gemma-3n

  # --- RQ3 LoRA fine-tuned checkpoints (local paths after run_rq3_finetune.py) ---
  # hf_repo is a local filesystem path relative to the repo root after training.
  # revision: null so from_pretrained does not resolve a Hub revision.
  - key: qwen3.5-0.8b-base-urdu-ft
    role: urdu_finetuning_arm
    hf_repo: results/finetuned_models/qwen3.5-0.8b-base-urdu-ft
    revision: null
    gated: false
    variant: base
    family: qwen3.5
    finetuned_from: qwen3.5-0.8b-base

  - key: qwen3.5-2b-base-urdu-ft
    role: urdu_finetuning_arm
    hf_repo: results/finetuned_models/qwen3.5-2b-base-urdu-ft
    revision: null
    gated: false
    variant: base
    family: qwen3.5
    finetuned_from: qwen3.5-2b-base

  - key: smollm3-3b-base-urdu-ft
    role: urdu_finetuning_arm
    hf_repo: results/finetuned_models/smollm3-3b-base-urdu-ft
    revision: null
    gated: false
    variant: base
    family: smollm3
    finetuned_from: smollm3-3b-base

  - key: gemma3n-e4b-base-urdu-ft
    role: urdu_finetuning_arm_optional
    hf_repo: results/finetuned_models/gemma3n-e4b-base-urdu-ft
    revision: null
    gated: false
    variant: base
    family: gemma-3n
    finetuned_from: gemma3n-e4b-base

# Measured Urdu tokenizer fragmentation (subword pieces per whitespace-delimited
# word) on a short sample sentence — informative spike only; RQ1 still computes
# fragmentation properly per item via fragmentation.py.
tokenizer_fragmentation_spike:
  qwen3.5-0.8b-base: 1.55
  smollm3-3b-instruct: 2.00
  gemma3n-e2b-instruct: 1.36
