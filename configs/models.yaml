# ---------------------------------------------------------------------------------------------
# Fine-tuning arm (2026-07-18): does giving a model real exposure to Urdu literary text change
# RQ1/RQ2, tested as a real before/after comparison rather than a correlational cross-model one.
# Each entry below is a LoRA-continued-pretrained variant of an existing base model above (same
# key + "-urdu-ft" suffix), trained on the Rekhta ghazal+nazm corpus (results/urdu_finetune_corpus/,
# built by scripts/prepare_urdu_finetune_corpus.py) via scripts/finetune_urdu_lora.py, then merged
# to a full local checkpoint (see each checkpoint's own finetune_manifest.json for exact
# hyperparameters). hf_repo is a local filesystem path, not a HF Hub repo -- `revision: null` is
# required so `from_pretrained` doesn't try to resolve a Hub revision against a local directory.
#
# IMPORTANT: these are deliberately NOT analyzed by the main 8-model pipeline (run_stage_c.py,
# analyze_architecture_breakdown.py, analyze_stage_b_diagnostics.py, plot_frequency_confound.py,
# analyze_layer_trends.py, run_stage_e_transliteration.py all explicitly skip any model key ending
# in "-urdu-ft") -- mixing them into those scripts' BH-correction families would retroactively
# shift the already-finalized 8-model q-values reported in the paper. Analyzed instead by
# scripts/analyze_finetuning_effect.py, which pairs each fine-tuned model against its own
# pre-fine-tuning numbers (already on disk from the main study) as its own separate comparison.
  - key: qwen3.5-0.8b-base-urdu-ft
    role: urdu_finetuning_arm
    hf_repo: /home/sali/CMAI-Projects/interpret-urdu/results/finetuned_models/qwen3.5-0.8b-base-urdu-ft
    revision: null
    gated: false
    variant: base
    family: qwen3.5
    finetuned_from: qwen3.5-0.8b-base

  - key: smollm3-3b-base-urdu-ft
    role: urdu_finetuning_arm
    hf_repo: /home/sali/CMAI-Projects/interpret-urdu/results/finetuned_models/smollm3-3b-base-urdu-ft
    revision: null
    gated: false
    variant: base
    family: smollm3
    finetuned_from: smollm3-3b-base

  - key: qwen3.5-2b-base-urdu-ft
    role: urdu_finetuning_arm
    hf_repo: /home/sali/CMAI-Projects/interpret-urdu/results/finetuned_models/qwen3.5-2b-base-urdu-ft
    revision: null
    gated: false
    variant: base
    family: qwen3.5
    finetuned_from: qwen3.5-2b-base

  - key: gemma3n-e4b-base-urdu-ft
    role: urdu_finetuning_arm
    hf_repo: /home/sali/CMAI-Projects/interpret-urdu/results/finetuned_models/gemma3n-e4b-base-urdu-ft
    revision: null
    gated: false
    variant: base
    family: gemma-3n
    finetuned_from: gemma3n-e4b-base

# Measured Urdu tokenizer fragmentation (subword pieces per whitespace-delimited word) on a short
# sample sentence, 2026-07-12 spike -- informs Stage A's fragmentation covariate and is *not* a
# substitute for computing it properly per-word over the actual candidate list in stage_a/frequency.py.
tokenizer_fragmentation_spike:
  gemma3n-e2b-instruct: 1.36
  qwen3.5-0.8b-base: 1.55
  smollm3-3b-instruct: 2.00
